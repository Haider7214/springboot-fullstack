apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-deployment
  labels:
    app: crm-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm-app
  template:
    metadata:
      labels:
        app: crm-app
    spec:
      containers:
      - name: crm-container
        image: haidertelusko/crm-app:latest
        ports:
        - containerPort: 8484
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://<EC2-MySQL-IP>:3306/javaai
        - name: SPRING_DATASOURCE_USERNAME
          value: root
        - name: SPRING_DATASOURCE_PASSWORD
          value: root123
